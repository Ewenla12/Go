<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Movie Server</title>
  <style>
    :root {
      --bg: #14101c;
      --card: #2f1b42;
      --accent: #f2b705;
      --text: #f3eef7;
      --muted: #a89bc2;
      --danger: #e63946;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 28px 32px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 16px;
      font-size: 1.9rem;
      letter-spacing: 0.5px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-bar input {
      width: 320px;
      max-width: 70vw;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #4a3466;
      background: #1e1430;
      color: var(--text);
      font-size: 0.95rem;
    }

    .search-bar input:focus {
      outline: 2px solid var(--accent);
    }

    .search-bar button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #1a1a1a;
      font-weight: 600;
      cursor: pointer;
    }

    .search-bar button:hover {
      opacity: 0.9;
    }

    .search-bar button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid #fd4f4f;
    }

    #status {
      text-align: center;
      color: var(--muted);
      margin: 10px 0 0;
      min-height: 1.2em;
      font-size: 0.9rem;
    }

    .add-panel {
      max-width: 640px;
      margin: 20px auto 0;
      padding: 18px 20px;
      background: var(--card);
      border-radius: 10px;
    }

    .add-panel summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .add-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .add-form input {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #4a3466;
      background: #1e1420;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
    }

    .add-form input.full {
      grid-column: 1 / -1;
    }

    .add-form button {
      grid-column: 1 / -1;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #1a1a1a;
      font-weight: 600;
      cursor: pointer;
    }

    .add-form button:hover {
      opacity: 0.9;
    }

    #addStatus {
      grid-column: 1 / -1;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.1em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 24px 32px 48px;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #03102e;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(230, 57, 70, 0.9);
      color: #fff;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn:hover {
      background: var(--danger);
    }

    .card-body {
      padding: 12px 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-body h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
    }

    .meta {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .rating {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(163, 138, 40, 0.15);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.82rem;
      width: fit-content;
    }

    .actors {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Movie Server</h1>
    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Search by title...">
      <button id="searchBtn">Search</button>
      <button id="resetBtn" class="secondary"> X </button>
    </div>
    <p id="status"></p>

    <details class="add-panel">
      <summary>+ Add a movie</summary>
      <form class="add-form" id="addForm">
        <input type="text" id="f_title" placeholder="Title" required>
        <input type="number" id="f_year" placeholder="Year" required>
        <input type="number" id="f_rating" placeholder="Rating (e.g. 8.2)" step="0.1" min="0" max="10" required>
        <input type="text" id="f_genre" placeholder="Genre" required>
        <input type="text" id="f_actors" class="full" placeholder="Actors, comma separated">
        <button type="submit">Add movie</button>
        <div id="addStatus"></div>
      </form>
    </details>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const addForm = document.getElementById('addForm');
    const addStatus = document.getElementById('addStatus');

    function posterUrl(title) {
      // Placeholder for picture since the movie has no image.
      const label = encodeURIComponent(title);
      return `https://placehold.co/300x445/1a1c22/e6b800?text=${label}&font=roboto`;
    }

    function render(movies) {
      grid.innerHTML = '';
      if (!movies || movies.length === 0) {
        status.textContent = 'No movies found.';
        return;
      }
      status.textContent = `${movies.length} movie${movies.length === 1 ? '' : 's'}`;
      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
        <button class="delete-btn" data-id="${m.id}" title="Delete">&times;</button>
        <img src="${posterUrl(m.title)}" alt="${m.title} poster" loading="lazy">
        <div class="card-body">
          <h3>${m.title}</h3>
          <div class="meta">${m.year} · ${m.genre}</div>
          <span class="rating">★ ${m.rating}</span>
          <div class="actors">${(m.actors || []).join(', ')}</div>
        </div>
      `;
        grid.appendChild(card);
      });
    }

    async function loadAll() {
      status.textContent = 'Loading...';
      try {
        const res = await fetch('/movies');
        const data = await res.json();
        render(data);
      } catch (e) {
        status.textContent = 'Failed to load movies.';
      }
    }

    async function search() {
      const q = searchInput.value.trim();
      if (!q) { loadAll(); return; }
      status.textContent = 'Searching...';
      try {
        const res = await fetch(`/search?title=${encodeURIComponent(q)}`);
        if (res.status === 404) { render([]); return; }
        const data = await res.json();
        render(data);
      } catch (e) {
        status.textContent = 'Search failed.';
      }
    }

    // handle delete button clicks (event delegation, since cards are
    // re-rendered dynamically)
    grid.addEventListener('click', async (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;

      const id = btn.dataset.id;
      if (!confirm('Delete this movie?')) return;

      try {
        const res = await fetch(`/movies/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('delete failed');
        // remove card without reloading
        btn.closest('.card').remove();
        status.textContent = 'Movie deleted.';
      } catch (err) {
        status.textContent = 'Failed to delete movie.';
      }
    });

    // handle add-movie form submit
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      addStatus.textContent = 'Saving...';

      const payload = {
        title: document.getElementById('f_title').value.trim(),
        year: parseInt(document.getElementById('f_year').value, 10),
        rating: parseFloat(document.getElementById('f_rating').value),
        genre: document.getElementById('f_genre').value.trim(),
        actors: document.getElementById('f_actors').value
          .split(',')
          .map(a => a.trim())
          .filter(a => a.length > 0),
      };

      try {
        const res = await fetch('/movies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'failed to add movie');
        }
        addForm.reset();
        addStatus.textContent = 'Movie added.';
        loadAll();
      } catch (err) {
        addStatus.textContent = err.message;
      }
    });

    searchBtn.addEventListener('click', search);
    resetBtn.addEventListener('click', () => { searchInput.value = ''; loadAll(); });
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

    loadAll();
  </script>

</body>

</html>
